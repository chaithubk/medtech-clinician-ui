name: Vendor Telemetry Contract

on:
  repository_dispatch:
    types: [contract-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Contract repo tag to vendor (e.g. v2.1.0).
          Leave blank to use the latest published tag automatically.
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Contract repo tag to vendor.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    name: Vendor schema and open PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CD_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve target tag and commit SHA
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG}"
          if [[ -z "${TAG}" ]]; then
            TAG=$(gh api repos/chaithubk/medtech-telemetry-contract/releases/latest --jq '.tag_name' 2>/dev/null || true)
            if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
              TAG=$(gh api repos/chaithubk/medtech-telemetry-contract/tags --jq '.[0].name' 2>/dev/null || true)
            fi
          fi

          if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
            echo "::error::Could not resolve target contract tag."
            exit 1
          fi

          COMMIT=$(gh api repos/chaithubk/medtech-telemetry-contract/commits/${TAG} --jq '.sha')
          if [[ -z "${COMMIT}" || "${COMMIT}" == "null" ]]; then
            echo "::error::Could not resolve commit for tag ${TAG}."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Download canonical schema
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          mkdir -p contracts/schemas/vitals
          curl -fsSL \
            "https://raw.githubusercontent.com/chaithubk/medtech-telemetry-contract/${TAG}/schemas/vitals/vitals.schema.json" \
            -o contracts/schemas/vitals/vitals.schema.json

      - name: Update contract pin metadata
        id: pin
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
import datetime as dt
import hashlib
import json
import os
from pathlib import Path

pin_path = Path("contracts/contract-pin.json")
schema_path = Path("contracts/schemas/vitals/vitals.schema.json")

previous_tag = ""
if pin_path.exists():
    try:
        previous = json.loads(pin_path.read_text(encoding="utf-8"))
        previous_tag = str(previous.get("tag") or previous.get("pin", {}).get("tag") or "")
    except json.JSONDecodeError:
        previous_tag = ""

def parse_semver(tag: str):
    raw = tag.lstrip("v")
    parts = raw.split(".")
    if len(parts) != 3:
        return None
    try:
        return tuple(int(p) for p in parts)
    except ValueError:
        return None

classification = "unknown"
breaking = False
prev = parse_semver(previous_tag) if previous_tag else None
curr = parse_semver(os.environ["TAG"])
if curr is not None:
    if prev is None:
        classification = "breaking"
        breaking = True
    elif curr[0] > prev[0]:
        classification = "breaking"
        breaking = True
    elif curr[1] > prev[1]:
        classification = "minor"
    elif curr[2] >= prev[2]:
        classification = "patch"

schema_digest = hashlib.sha256(schema_path.read_bytes()).hexdigest()
expected_payload_version = os.environ["TAG"].lstrip("v")

pin = {
    "contract_repo": "chaithubk/medtech-telemetry-contract",
    "tag": os.environ["TAG"],
    "commit_sha": os.environ["COMMIT"],
    "schema_path": "schemas/vitals/vitals.schema.json",
    "local_schema": "contracts/schemas/vitals/vitals.schema.json",
    "synced_at_utc": dt.datetime.now(dt.UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
    "contract": "vitals",
    "source": {
        "repository": "https://github.com/chaithubk/medtech-telemetry-contract",
        "schema_path": "schemas/vitals/vitals.schema.json"
    },
    "pin": {
        "tag": os.environ["TAG"],
        "upstream_commit": os.environ["COMMIT"],
        "schema_revision": f"sha256:{schema_digest}"
    },
    "compatibility": {
        "classification": classification,
        "breaking": breaking,
        "source": "semver",
        "change_type": "breaking" if breaking else "non-breaking",
        "notes": f"Automated vendored update to {os.environ['TAG']}."
    },
    "consumer": {
        "vendored_schema_path": "contracts/schemas/vitals/vitals.schema.json",
        "runtime_schema_path": "/usr/share/medtech/contracts/schemas/vitals/vitals.schema.json",
        "expected_payload_version": expected_payload_version
    }
}

pin_path.write_text(json.dumps(pin, indent=2) + "\n", encoding="utf-8")
print(f"compatibility_classification={classification}")
with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
    out.write(f"classification={classification}\n")
PY

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CD_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          CLASSIFICATION: ${{ steps.pin.outputs.classification }}
        run: |
          set -euo pipefail

          BRANCH="chore/vendor-telemetry-contract-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add contracts/schemas/vitals/vitals.schema.json contracts/contract-pin.json
          git commit -m "chore: vendor telemetry contract ${TAG}

          - Updated contracts/schemas/vitals/vitals.schema.json
          - Updated contracts/contract-pin.json
          - Pinned to ${TAG} (${COMMIT})"
          git push --force-with-lease origin "${BRANCH}"

          PR_NUMBER=$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')

          PR_BODY="## Automated contract update

          Vendored schema from [chaithubk/medtech-telemetry-contract@${TAG}](https://github.com/chaithubk/medtech-telemetry-contract/releases/tag/${TAG}).

          | Field | Value |
          |---|---|
          | Tag | ${TAG} |
          | Commit SHA | ${COMMIT} |
          | Compatibility classification | ${CLASSIFICATION} |

          ### Review checklist
          - [ ] Review schema diff in contracts/schemas/vitals/vitals.schema.json
          - [ ] Review metadata diff in contracts/contract-pin.json
          - [ ] Verify CI passes
          - [ ] For breaking changes, complete migration checklist before merge"

          if [[ -n "${PR_NUMBER}" ]]; then
            gh pr edit "${PR_NUMBER}" --title "chore: vendor telemetry contract ${TAG}" --body "${PR_BODY}"
          else
            gh pr create --title "chore: vendor telemetry contract ${TAG}" --body "${PR_BODY}" --base main --head "${BRANCH}"
          fi
