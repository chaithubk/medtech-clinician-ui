name: Vendor Telemetry Contract

on:
  repository_dispatch:
    types: [contract-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Contract repo tag to vendor (e.g. v2.1.0).
          Leave blank to use the latest published tag automatically.
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Contract repo tag to vendor.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    name: Vendor schema and open PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CD_PAT || secrets.GITHUB_TOKEN }}

      - name: Vendor contract update
        uses: ./.github/actions/vendor-contract-update
        with:
          tag: ${{ inputs.tag || github.event.inputs.tag || github.event.client_payload.tag }}
          github-token: ${{ secrets.CD_PAT || secrets.GITHUB_TOKEN }}
