name: Contract Drift Check

on:
  repository_dispatch:
    types: [contract-release-published]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    name: Resolve target contract tag
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      pinned: ${{ steps.pinned.outputs.version }}
      target: ${{ steps.target.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned contract version
        id: pinned
        shell: bash
        run: |
          VERSION=$(python3 .github/scripts/read_pinned_contract_tag.py)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pinned contract version: ${VERSION}"

      - name: Resolve target tag
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CD_PAT || github.token }}
        run: |
          bash .github/scripts/resolve_contract_ref.sh "${{ github.event.client_payload.tag }}"

      - name: Compare versions
        id: compare
        shell: bash
        run: |
          bash .github/scripts/compare_contract_tags.sh "${{ steps.pinned.outputs.version }}" "${{ steps.target.outputs.tag }}"

  auto-vendor:
    name: Auto-create contract update PR
    needs: resolve
    if: needs.resolve.outputs.drift == 'true'
    uses: ./.github/workflows/vendor-telemetry-contract.yml
    with:
      tag: ${{ needs.resolve.outputs.target }}
    secrets: inherit
