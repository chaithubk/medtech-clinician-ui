name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake g++ pkg-config \
            clang-format clang-tidy \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxkbcommon-dev \
            qt6-base-dev qt6-declarative-dev libqt6opengl6-dev libqt6svg6-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            libmosquitto-dev

      - name: Check code formatting (clang-format)
        run: |
          find src tests -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

      - name: Generate compile commands for clang-tidy
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..

      - name: Static analysis (clang-tidy)
        run: |
          find src -name "*.cpp" | \
            xargs clang-tidy -p build 2>&1 || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake g++ pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxkbcommon-dev \
            qt6-base-dev qt6-declarative-dev libqt6opengl6-dev libqt6svg6-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            libmosquitto-dev \
            lcov

      - name: Configure (coverage build)
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" ..

      - name: Build
        run: make -C build -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -V

      - name: Generate coverage report
        run: |
          cd build
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/coverage.info
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn --include='*.cpp' --include='*.h' \
            -iE '(password|secret|api_key)\s*=\s*"[^"]+"' src/ || \
            (echo "::error::Hardcoded secret detected in source" && exit 1)

      - name: Check CMake for unsafe shell invocations
        run: |
          if grep -iE 'execute_process|system\(' CMakeLists.txt src/CMakeLists.txt 2>/dev/null; then
            echo "::warning::Shell execution found in CMake — review manually"
          fi

  smoke-test:
    name: Smoke Test (local image)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: medtech-clinician-ui:ci

      - name: Run smoke test
        uses: ./.github/actions/smoke-test
        with:
          image: medtech-clinician-ui:ci

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, security, smoke-test]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}"       != "success" || \
                "${{ needs.test.result }}"       != "success" || \
                "${{ needs.security.result }}"   != "success" || \
                "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
