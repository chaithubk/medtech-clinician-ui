name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash .github/scripts/install_deps.sh

      - name: Check code formatting (clang-format)
        run: bash .github/scripts/check_format.sh

      - name: Generate compile commands for clang-tidy
        run: bash .github/scripts/gen_compile_commands.sh

      - name: Static analysis (clang-tidy)
        run: bash .github/scripts/clang_tidy.sh

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash .github/scripts/install_deps_with_lcov.sh

      - name: Configure (coverage build)
        run: bash .github/scripts/configure_coverage.sh

      - name: Build
        run: bash .github/scripts/build.sh

      - name: Run unit tests
        run: bash .github/scripts/run_tests.sh

      - name: Generate coverage report
        run: bash .github/scripts/gen_coverage.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/coverage.info
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: bash .github/scripts/check_secrets.sh

      - name: Check CMake for unsafe shell invocations
        run: bash .github/scripts/check_cmake_shell.sh

  smoke-test:
    name: Smoke Test (local image)
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: medtech-clinician-ui:ci

      - name: Run smoke test
        uses: ./.github/actions/smoke-test
        with:
          image: medtech-clinician-ui:ci
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, security, smoke-test]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}"       != "success" || \
                "${{ needs.test.result }}"       != "success" || \
                "${{ needs.security.result }}"   != "success" || \
                "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
